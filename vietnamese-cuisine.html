<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <meta name="description" content="쌀국수부터 지역 별미와 디저트까지, 대표적인 베트남 요리 20가지를 소개합니다.">
  <title>베트남 요리 백과 — 브이티투짱</title>
  <style>
    :root { color-scheme: light; --paper:#f5f3ef; --ink:#20211f; --muted:#73746e; --accent:#526b5a; --line:rgba(32,33,31,.14); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .shell { width:min(1080px,calc(100% - 48px)); margin:0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; min-height:78px; border-bottom:1px solid var(--line); }
    .brand { text-decoration:none; font-size:14px; font-weight:750; letter-spacing:-.03em; }
    .back { color:var(--muted); font-size:13px; text-decoration:none; }
    .back:hover { color:var(--accent); }
    .hero { padding:74px 0 44px; }
    .eyebrow { margin:0 0 16px; color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(46px,8vw,84px); line-height:1; letter-spacing:-.075em; }
    .lead { max-width:680px; margin:22px 0 0; color:var(--muted); font-size:16px; line-height:1.9; word-break:keep-all; }
    .list-head { display:flex; justify-content:space-between; align-items:end; gap:24px; padding:22px 0 18px; border-top:1px solid var(--line); }
    .list-head h2 { margin:0; font-size:22px; letter-spacing:-.04em; }
    .page-status { color:var(--muted); font-size:13px; }
    .dish-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .dish-card { position:relative; min-height:214px; display:flex; flex-direction:column; padding:23px 24px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.5); }
    .dish-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .dish-number { color:#a7a79f; font-size:11px; font-weight:750; letter-spacing:.12em; }
    .dish-icon { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:#e8eae2; font-size:22px; }
    .region { display:inline-block; margin:16px 0 8px; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.04em; }
    .dish-card h3 { margin:0; font-size:22px; letter-spacing:-.045em; }
    .dish-viet { display:block; margin-top:3px; color:var(--muted); font-size:12px; font-weight:500; letter-spacing:.01em; }
    .dish-card p { margin:13px 0 0; color:#5f605b; font-size:13px; line-height:1.8; word-break:keep-all; }
    .pagination { display:flex; justify-content:center; align-items:center; gap:8px; padding:32px 0 70px; }
    .page-button { min-width:42px; height:42px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; }
    .page-button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
    .page-button[aria-current="page"] { border-color:var(--accent); background:var(--accent); color:#fff; }
    .page-button:disabled { opacity:.38; cursor:not-allowed; }
    .page-button.arrow { padding:0 16px; }
    .sources { padding:20px 0 28px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; line-height:1.8; }
    .sources a { color:var(--accent); }
    footer { display:flex; justify-content:space-between; gap:16px; padding:18px 0 28px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
    @media(max-width:640px) {
      .shell { width:calc(100% - 36px); }
      .hero { padding:58px 0 34px; }
      .dish-grid { grid-template-columns:1fr; }
      .dish-card { min-height:0; }
      .list-head { align-items:start; flex-direction:column; gap:8px; }
      footer { flex-direction:column; }
      .pagination { padding-bottom:48px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="https://buitrang29012005-debug.github.io/">브이티투짱</a>
      <a class="back" href="https://buitrang29012005-debug.github.io/">← 홈페이지 메인</a>
    </header>
    <main>
      <section class="hero">
        <p class="eyebrow">A taste of Vietnam</p>
        <h1>베트남 요리 백과</h1>
        <p class="lead">한 그릇의 국수부터 지역의 식탁과 명절 음식까지. 베트남을 대표하는 요리 20가지를 이름과 지역, 재료와 맛의 특징으로 살펴봅니다.</p>
      </section>
      <section aria-labelledby="list-title">
        <div class="list-head">
          <h2 id="list-title">대표 요리 20</h2>
          <span class="page-status" id="page-status" aria-live="polite"></span>
        </div>
        <div class="dish-grid" id="dish-grid" aria-live="polite"></div>
        <nav class="pagination" id="pagination" aria-label="요리 목록 페이지"></nav>
      </section>
    </main>
    <section class="sources" aria-label="참고 자료">
      요리 설명은 지역별 특징과 대표 요리 소개 자료를 바탕으로 정리했습니다.
      참고: <a href="https://vietnam.travel/node/195" target="_blank" rel="noreferrer">Vietnam Tourism, 21 Must-try Vietnamese Dishes</a> ·
      <a href="https://vietnam.travel/things-to-do/vietnam-foodie-guide-region" target="_blank" rel="noreferrer">Vietnam Tourism, A Foodie Guide by Region</a>
    </section>
    <footer>
      <span>© <span id="year"></span> 브이티투짱</span>
      <span>베트남의 맛을 천천히 알아가는 중</span>
    </footer>
  </div>
  <script>
    const dishes = [{"name":"Phở bò","viet":"Phở bò","region":"북부 · 하노이","emoji":"🍜","desc":"쌀국수와 소고기를 향신료를 넣어 오래 끓인 맑은 육수에 담아내는 대표 국수입니다. 남부식은 숙주와 바질 등 생허브를 넉넉히 곁들이기도 합니다."},{"name":"Bánh mì","viet":"Bánh mì","region":"전국 · 지역별 변형","emoji":"🥖","desc":"겉은 바삭하고 속은 부드러운 바게트에 파테, 고기, 절임 채소, 오이와 고수를 채운 베트남식 샌드위치입니다."},{"name":"Bún chả","viet":"Bún chả","region":"북부 · 하노이","emoji":"🔥","desc":"숯불에 구운 돼지고기와 완자를 새콤달콤한 느억맘 소스에 담고, 쌀국수와 허브를 곁들여 먹습니다."},{"name":"Bún bò Huế","viet":"Bún bò Huế","region":"중부 · 후에","emoji":"🌶️","desc":"레몬그라스 향이 진한 매콤한 육수에 굵은 쌀국수와 소고기를 넣은 후에식 국수입니다. 돼지고기 소시지를 함께 올리기도 합니다."},{"name":"Cao lầu","viet":"Cao lầu","region":"중부 · 호이안","emoji":"🥢","desc":"도톰하고 쫄깃한 면에 양념 돼지고기, 생허브, 바삭한 토핑을 더한 호이안의 명물입니다. 국물은 자작하게 곁들입니다."},{"name":"Mì Quảng","viet":"Mì Quảng","region":"중부 · 꽝남","emoji":"🍋","desc":"강황빛 넓은 면에 진한 육수를 조금만 붓고 돼지고기나 새우, 허브, 땅콩과 쌀과자를 올려 먹는 꽝남식 국수입니다."},{"name":"Cơm tấm","viet":"Cơm tấm","region":"남부 · 호찌민","emoji":"🍚","desc":"부서진 쌀알로 지은 밥에 숯불 돼지갈비, 달걀, 파기름과 새콤달콤한 느억맘 소스를 곁들인 남부의 한 끼입니다."},{"name":"Bánh xèo","viet":"Bánh xèo","region":"남부·중부","emoji":"🥞","desc":"강황을 넣은 쌀가루 반죽을 얇고 바삭하게 부쳐 돼지고기, 새우, 숙주를 채운 뒤 채소와 라이스페이퍼에 싸 먹습니다."},{"name":"Gỏi cuốn","viet":"Gỏi cuốn","region":"남부 · 전국에서 즐김","emoji":"🌿","desc":"라이스페이퍼에 쌀국수, 새우나 돼지고기, 민트와 여러 생채소를 넣어 말아 땅콩 소스 또는 느억맘에 찍어 먹습니다."},{"name":"Cơm gà Hội An","viet":"Cơm gà Hội An","region":"중부 · 호이안","emoji":"🍗","desc":"강황과 닭 육수로 지은 노란 밥에 잘게 찢은 닭고기, 허브와 절임 채소를 곁들인 호이안식 닭고기 밥입니다."},{"name":"Bánh bèo","viet":"Bánh bèo","region":"중부 · 후에","emoji":"🦐","desc":"작고 부드러운 쌀가루 찜떡 위에 새우 가루나 녹두, 바삭한 토핑을 올리고 각종 느억맘 소스와 함께 먹습니다."},{"name":"Bún riêu","viet":"Bún riêu","region":"북부 · 하노이","emoji":"🍅","desc":"토마토의 산뜻한 맛과 민물게 육수를 바탕으로 두부와 쌀국수를 넣어 끓인 국수입니다. 게살과 달걀을 섞은 고명이 올라갑니다."},{"name":"Bánh căn","viet":"Bánh căn","region":"남중부 · 해안 지역","emoji":"🥘","desc":"작은 흙틀에 쌀 반죽과 메추리알 등을 넣어 구운 한입 크기 간식입니다. 새우나 돼지고기를 얹고 파와 고기가 든 소스에 찍어 먹습니다."},{"name":"Hủ tiếu Nam Vang","viet":"Hủ tiếu Nam Vang","region":"남부 · 호찌민","emoji":"🍲","desc":"돼지뼈 육수와 쌀면을 바탕으로 돼지고기, 새우, 간, 메추리알 등을 올린 남부의 국수입니다. 국물형과 비빔형이 있습니다."},{"name":"Chả cá","viet":"Chả cá Lã Vọng","region":"북부 · 하노이","emoji":"🐟","desc":"강황에 재운 흰살생선을 팬에 익힌 뒤 딜과 파를 듬뿍 더해 먹는 하노이의 생선 요리입니다. 쌀국수와 허브를 곁들입니다."},{"name":"Nộm hoa chuối","viet":"Nộm hoa chuối","region":"북부·남부","emoji":"🥗","desc":"잘게 썬 바나나 꽃봉오리에 허브, 절임 채소, 땅콩과 새콤한 소스를 버무린 샐러드입니다. 닭고기나 새우를 더하기도 합니다."},{"name":"Bánh cuốn","viet":"Bánh cuốn","region":"북부 · 하노이","emoji":"🥢","desc":"얇게 쪄낸 쌀가루 피에 다진 돼지고기와 목이버섯을 넣어 말고, 튀긴 샬롯과 허브, 소시지 및 느억맘 소스를 곁들입니다."},{"name":"Bún chả cá","viet":"Bún chả cá","region":"중부 해안 · 냐짱","emoji":"🐠","desc":"쌀국수와 생선완자를 맑은 국물에 담아내는 해안 도시의 국수입니다. 냐짱식에는 오징어 완자와 토마토, 딜이 들어가기도 합니다."},{"name":"Bò lá lốt","viet":"Bò lá lốt","region":"남부","emoji":"🍃","desc":"마늘과 샬롯으로 양념한 다진 소고기를 라롯 잎에 말아 숯불에 구운 요리입니다. 허브와 쌀국수, 라이스페이퍼와 함께 즐깁니다."},{"name":"Chè","viet":"Chè","region":"전국 · 다양한 종류","emoji":"🥥","desc":"콩과 젤리, 과일, 찹쌀 등을 조합해 만드는 베트남식 디저트의 큰 갈래입니다. 코코넛 밀크나 얼음을 더해 차갑게 즐기는 종류도 많습니다."},{"name":"Bánh chưng","viet":"Bánh chưng","region":"북부 · 뗏(Tết)","emoji":"🎋","desc":"뗏 설날에 즐기는 네모난 찹쌀떡입니다. 녹두와 돼지고기를 찹쌀과 함께 동잎에 싸서 쪄내며 가족이 함께 만들기도 합니다."}];
    const pageSize = 10;
    let currentPage = 1;
    const grid = document.getElementById("dish-grid");
    const pager = document.getElementById("pagination");
    const status = document.getElementById("page-status");
    function renderPage() {
      const totalPages = Math.ceil(dishes.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      const visible = dishes.slice(start, start + pageSize);
      grid.innerHTML = visible.map((dish, index) => `
        <article class="dish-card">
          <div class="dish-top">
            <span class="dish-number">NO. ${String(start + index + 1).padStart(2, "0")}</span>
            <span class="dish-icon" aria-hidden="true">${dish.emoji}</span>
          </div>
          <span class="region">${dish.region}</span>
          <h3>${dish.name}<span class="dish-viet">${dish.viet}</span></h3>
          <p>${dish.desc}</p>
        </article>`).join("");
      status.textContent = `${start + 1}–${start + visible.length} / ${dishes.length}가지`;
      pager.innerHTML = "";
      const previous = document.createElement("button");
      previous.className = "page-button arrow";
      previous.textContent = "이전";
      previous.disabled = currentPage === 1;
      previous.setAttribute("aria-label", "이전 페이지");
      previous.addEventListener("click", () => changePage(currentPage - 1));
      pager.appendChild(previous);
      for (let page = 1; page <= totalPages; page++) {
        const button = document.createElement("button");
        button.className = "page-button";
        button.textContent = page;
        button.setAttribute("aria-label", `${page}페이지`);
        if (page === currentPage) button.setAttribute("aria-current", "page");
        button.addEventListener("click", () => changePage(page));
        pager.appendChild(button);
      }
      const next = document.createElement("button");
      next.className = "page-button arrow";
      next.textContent = "다음";
      next.disabled = currentPage === totalPages;
      next.setAttribute("aria-label", "다음 페이지");
      next.addEventListener("click", () => changePage(currentPage + 1));
      pager.appendChild(next);
    }
    function changePage(page) {
      const totalPages = Math.ceil(dishes.length / pageSize);
      if (page < 1 || page > totalPages || page === currentPage) return;
      currentPage = page;
      renderPage();
      document.getElementById("list-title").scrollIntoView({ behavior: "smooth", block: "start" });
    }
    document.getElementById("year").textContent = new Date().getFullYear();
    renderPage();
  </script>
</body>
</html>
