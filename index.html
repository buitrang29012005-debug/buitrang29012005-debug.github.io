<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">
  <meta name="description" content="브이티투짱의 개인 홈페이지입니다.">
  <title>브이티투짱 — 개인 홈페이지</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ef;
      --ink: #20211f;
      --muted: #73746e;
      --accent: #526b5a;
      --line: rgba(32, 33, 31, .14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 84px;
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 14px; font-weight: 750; letter-spacing: -.03em; text-decoration: none; }
    .nav { display: flex; gap: 28px; font-size: 13px; color: var(--muted); }
    .nav a { text-decoration: none; }
    .nav a:hover { color: var(--ink); }
    .hero {
      min-height: min(720px, calc(100svh - 85px));
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      align-items: center;
      gap: 56px;
      padding: 90px 0 110px;
    }
    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(56px, 9vw, 112px);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 720;
    }
    .intro {
      max-width: 480px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.85;
      word-break: keep-all;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-top: 34px;
      padding: 13px 0;
      border-bottom: 1px solid var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }
    .cta span { transition: transform .2s ease; }
    .cta:hover span { transform: translate(3px, -3px); }
    .art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 390px;
      overflow: hidden;
      background: #e6e7df;
      border-radius: 48% 48% 8px 8px;
    }
    .art::before, .art::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(82, 107, 90, .35);
      border-radius: 50%;
    }
    .art::before { width: 260px; height: 260px; }
    .art::after { width: 330px; height: 330px; }
    .orb {
      z-index: 1;
      display: grid;
      place-items: center;
      width: 190px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      color: #f5f3ef;
      font-size: clamp(44px, 6vw, 68px);
      font-weight: 700;
      letter-spacing: -.08em;
      box-shadow: 0 22px 60px rgba(41, 57, 46, .2);
    }
    .spark {
      position: absolute;
      z-index: 2;
      color: #bd805f;
      font-size: 28px;
    }
    .spark.one { top: 22%; right: 21%; }
    .spark.two { bottom: 20%; left: 19%; font-size: 18px; }
    section.about {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 48px;
      padding: 34px 0 100px;
      border-top: 1px solid var(--line);
    }
    .section-label { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
    .about h2 { margin: 0 0 18px; font-size: clamp(25px, 4vw, 38px); letter-spacing: -.055em; }
    .about p { max-width: 610px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.9; word-break: keep-all; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 0 30px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      .shell { width: min(100% - 36px, 560px); }
      header { min-height: 70px; }
      .nav { gap: 18px; }
      .hero { grid-template-columns: 1fr; gap: 46px; min-height: auto; padding: 82px 0 90px; }
      .art { min-height: 310px; }
      .art::before { width: 220px; height: 220px; }
      .art::after { width: 280px; height: 280px; }
      .orb { width: 160px; }
      section.about { grid-template-columns: 1fr; gap: 22px; padding-bottom: 75px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#" aria-label="처음으로">브이티투짱</a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="#about">소개</a>
        <a href="https://github.com/buitrang29012005-debug" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="title">
        <div>
          <p class="eyebrow">A little corner of the internet</p>
          <h1 id="title">안녕하세요,<br>브이티투짱입니다.</h1>
          <p class="intro">저만의 공간에 오신 것을 환영합니다. 관심 있는 것들을 하나씩 기록하고, 새로운 것을 만들어 가는 중입니다.</p>
          <a class="cta" href="#about">더 알아보기 <span aria-hidden="true">↘</span></a>
        </div>
        <div class="art" aria-hidden="true">
          <span class="spark one">✳</span>
          <span class="spark two">✦</span>
          <div class="orb">안녕</div>
        </div>
      </section>

      <section class="about" id="about" aria-labelledby="about-title">
        <div class="section-label">About this space</div>
        <div>
          <h2 id="about-title">천천히, 나답게.</h2>
          <p>이곳은 브이티투짱의 개인 홈페이지입니다. 앞으로 좋아하는 것과 작업, 생각을 이곳에 차곡차곡 담아 보려고 합니다. 편하게 둘러봐 주세요.</p>
        </div>
      </section>
    </main>

    <footer>
      <span>© <span id="year"></span> 브이티투짱</span>
      <span>Made with care · GitHub Pages</span>
    </footer>
  </div>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
